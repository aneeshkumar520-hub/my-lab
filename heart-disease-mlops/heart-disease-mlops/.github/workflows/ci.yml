name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install flake8==7.4.1
      - name: flake8
        run: flake8 src tests scripts

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (fails the pipeline on any error)
        run: >
          pytest --cov=src/heart --cov-report=term-missing --cov-report=xml
          --junitxml=pytest-report.xml
        env: {PYTHONPATH: src}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            pytest-report.xml
            coverage.xml

  train:
    name: Train model (MLflow tracked)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Download data (falls back to the committed copy if the mirror is down)
        run: python scripts/download_data.py || echo "using committed data/raw/heart.csv"
        env: {PYTHONPATH: src}
      - name: Clean data
        run: python -m heart.data
        env: {PYTHONPATH: src}
      - name: Train, tune and evaluate
        run: python -m heart.train 2>&1 | tee training.log
        env: {PYTHONPATH: src}
      - name: Quality gate (ROC-AUC on hold-out set must be >= 0.80)
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("models/metadata.json"))["test_metrics"]
          print(m)
          sys.exit(0 if m["roc_auc"] >= 0.80 else "ROC-AUC below the 0.80 gate")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-tracking
          path: |
            models/
            mlflow.db
            training.log

  docker:
    name: Build image and smoke-test container
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: model-and-tracking, path: .}
      - name: Build image
        run: docker build -t heart-disease-api:ci .
      - name: Run container and call /predict
        run: |
          docker run -d --name api -p 8000:8000 heart-disease-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 1; done
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"age":63,"sex":1,"cp":3,"trestbps":145,"chol":233,"fbs":1,"restecg":0,"thalach":150,"exang":0,"oldpeak":2.3,"slope":0,"ca":0,"thal":1}' | tee predict.json
          python -c "import json; r=json.load(open('predict.json')); assert r['prediction'] in (0,1) and 0.5<=r['confidence']<=1"
          curl -sf localhost:8000/metrics | grep -q predictions_total
      - name: Container logs
        if: always()
        run: docker logs api | tee container.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: container-smoke-test, path: "predict.json\ncontainer.log"}

  publish:
    name: Push image to GHCR (main only)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: model-and-tracking, path: .}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/heart-disease-api:latest
            ghcr.io/${{ github.repository_owner }}/heart-disease-api:${{ github.sha }}
