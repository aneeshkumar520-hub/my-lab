apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-api
  labels: {app: heart-api}
spec:
  type: LoadBalancer        # Minikube: run `minikube tunnel`; Docker Desktop: reachable on localhost
  selector: {app: heart-api}
  ports:
    - name: http
      port: 80
      targetPort: 8000
